spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:localdevpassword}

logging:
  level:
    com.ssafy.s309: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: localDevSecretKeyMustBeAtLeast32BytesLongForHS256Algorithm
  access-expiration-ms: 3600000
  refresh-expiration-ms: 2592000000
  issuer: glucofit-backend
