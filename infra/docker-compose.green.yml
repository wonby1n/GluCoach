services:
  backend-green:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: s309-backend-green
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TZ: Asia/Seoul
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-northeast-2}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AI_SERVICE_URL: http://ai-green:8000
      FOOD_API_KEY: ${FOOD_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w1 localhost 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal

  ai-green:
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: s309-ai-green
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      TZ: Asia/Seoul
      DEBUG: ${AI_DEBUG:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-agent-key-change-in-prod}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend-green:8080}
    volumes:
      - ai-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    networks:
      - internal

volumes:
  ai-models:
    name: s309-ai-models

networks:
  internal:
    external: true
    name: s309-internal
